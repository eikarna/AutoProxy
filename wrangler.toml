name = "autoproxy"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Free tier: 100,000 requests/day, 10 ms CPU time per request.
# No KV/D1/R2 bindings are used — the worker fetches and checks proxies on the fly.

[vars]
# Tunables (can be overridden with `wrangler secret` or here as plain vars)
PROXY_TARGET = "8"          # how many live proxies to put in the PAC
PROXY_CANDIDATES = "40"     # how many candidate proxies to sample and check per request
CHECK_TIMEOUT_MS = "2500"   # per-proxy health-check timeout
CACHE_TTL = "300"           # seconds edge cache keeps one pooled PAC response
PAC_ROUTE_BYPASS = "true"   # bypass proxy for plain hostnames, localhost, and private IPs
